<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica, Arial, sans-serif">
  <title>Buildings and vegetation as obstacles (swissSURFACE3D) above the bare ground (swissALTI3D)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6fb"/><stop offset="1" stop-color="#f4f9ff"/>
    </linearGradient>
    <g id="plane">
      <path d="M-16,0 L12,-3 L18,0 L12,3 Z" fill="#37474f"/>
      <path d="M-2,0 L-10,-13 L-5,-13 L6,0 L-5,13 L-10,13 Z" fill="#37474f"/>
      <path d="M-14,0 L-18,-6 L-15,-6 L-10,0 L-15,6 L-18,6 Z" fill="#37474f"/>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="url(#sky)"/>
  <text x="450" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2a38">Buildings and vegetation as obstacles</text>

  <!-- ground (swissALTI3D) -->
  <rect x="0" y="330" width="900" height="90" fill="#7a8a5b"/>
  <line x1="0" y1="330" x2="900" y2="330" stroke="#4b5a36" stroke-width="2"/>
  <text x="880" y="352" text-anchor="end" font-size="13" font-weight="bold" fill="#fff">Ground: swissALTI3D (bare earth)</text>

  <!-- surface (swissSURFACE3D): building and tree -->
  <rect x="280" y="230" width="80" height="100" fill="#9aa5ab" stroke="#4f5b62" stroke-width="2"/>
  <text x="320" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Building</text>
  <line x1="548" y1="330" x2="548" y2="290" stroke="#5d4037" stroke-width="5"/>
  <ellipse cx="548" cy="262" rx="30" ry="38" fill="#388e3c" stroke="#1b5e20" stroke-width="2"/>
  <text x="548" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">Tree</text>

  <!-- antenna: height above the ground -->
  <line x1="80" y1="330" x2="80" y2="292" stroke="#263238" stroke-width="4"/>
  <circle cx="80" cy="290" r="5" fill="#d32f2f"/>
  <line x1="58" y1="331" x2="58" y2="291" stroke="#37474f" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="50" y="384" text-anchor="start" font-size="12" fill="#1b2a38">ant-h above</text>
  <text x="50" y="399" text-anchor="start" font-size="12" fill="#1b2a38">the ground</text>
  <text x="80" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a38">Receiver</text>

  <!-- shadow behind the building and the tree -->
  <polygon points="360,231 900,330 360,330" fill="#e53935" fill-opacity="0.13"/>

  <!-- low aircraft behind the building: hidden -->
  <line x1="80" y1="290" x2="450" y2="302" stroke="#e53935" stroke-width="2.2" stroke-dasharray="4 4"/>
  <use href="#plane" x="450" y="302"/>
  <!-- aircraft inside the building: not visible -->
  <use href="#plane" x="320" y="276"/>
  <!-- high aircraft: visible -->
  <line x1="80" y1="290" x2="700" y2="120" stroke="#2e7d32" stroke-width="3"/>
  <use href="#plane" x="700" y="120"/>
  <line x1="740" y1="331" x2="740" y2="121" stroke="#37474f" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="752" y="232" font-size="12" fill="#1b2a38">height above the</text>
  <text x="752" y="247" font-size="12" fill="#1b2a38">ground (AGL)</text>
  <text x="700" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">clears the roof: visible</text>

  <!-- annotations -->
  <rect x="24" y="48" width="352" height="118" rx="8" fill="#fff" fill-opacity="0.85" stroke="#90a4ae"/>
  <text x="38" y="70" font-size="13.5" font-weight="bold" fill="#1b2a38">With --surface</text>
  <text x="38" y="91" font-size="13" fill="#33414d">• obstacles = higher of ground and surface</text>
  <text x="38" y="109" font-size="13" fill="#33414d">• heights (AGL) stay relative to the ground</text>
  <text x="38" y="127" font-size="13" fill="#33414d">• an aircraft inside a building is not visible</text>
  <text x="38" y="145" font-size="13" fill="#33414d">• surface = swissSURFACE3D (buildings, trees)</text>
  <text x="450" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">low aircraft behind the building: hidden</text>
  <text x="320" y="318" text-anchor="middle" font-size="11" fill="#7f0000" stroke="#9aa5ab" stroke-width="3" paint-order="stroke">inside: not visible</text>
</svg>
